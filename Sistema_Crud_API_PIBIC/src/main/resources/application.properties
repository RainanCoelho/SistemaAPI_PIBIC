spring.application.name=SistemaCrud

spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

app.security.jwt.expiration-minutes=30
app.security.login.max-attempts=5
app.security.login.lock-minutes=15
app.docs.public=false
app.cors.allowed-origins=

spring.ai.openai.api-key=${IA_CHAVE_API:${GROQ_API_KEY:}}
spring.ai.openai.base-url=${IA_URL_BASE:${GROQ_BASE_URL:http://127.0.0.1:3001/v1}}
spring.ai.openai.chat.model=${IA_MODELO:${GROQ_MODEL:auto}}
spring.ai.openai.chat.temperature=${IA_TEMPERATURA:${GROQ_TEMPERATURE:0.2}}
spring.ai.openai.chat.max-tokens=${IA_MAXIMO_TOKENS_SAIDA:4000}
spring.ai.openai.timeout=${IA_TEMPO_LIMITE:30s}
spring.ai.openai.max-retries=${IA_MAXIMO_TENTATIVAS_HTTP:0}

app.ia.limite-por-minuto=${IA_LIMITE_POR_MINUTO:5}
app.ia.limite-por-dia=${IA_LIMITE_POR_DIA:20}
app.ia.maximo-simultaneas=${IA_MAXIMO_SIMULTANEAS:3}
# Retencao do ledger idempotente; apos esse prazo a mesma chave e reinicializada, sem apagar registros.
app.ia.idempotencia.ttl=${IA_IDEMPOTENCIA_TTL:1h}
app.http.limite-corpo-bytes=${HTTP_LIMITE_CORPO_BYTES:1048576}

spring.jackson.factory.constraints.read.max-document-length=${HTTP_LIMITE_CORPO_BYTES:1048576}
spring.jackson.factory.constraints.read.max-string-length=262144
spring.jackson.factory.constraints.read.max-nesting-depth=100
spring.jackson.factory.constraints.read.max-token-count=10000
