spring.application.name=SistemaCrud

spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

app.security.jwt.expiration-minutes=30
app.security.login.max-attempts=5
app.security.login.lock-minutes=15
app.docs.public=false
app.cors.allowed-origins=

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.temperature=${GROQ_TEMPERATURE:0.4}
