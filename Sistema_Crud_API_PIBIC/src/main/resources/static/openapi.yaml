openapi: 3.0.3
info:
  title: SistemaAPI PIBIC
  version: 1.0.0
  description: |
    API REST para gerenciamento e resolucao de casos clinicos academicos.
    As operacoes de IA aceitam somente dados sinteticos ou previamente
    desidentificados e toda saida exige revisao humana antes da publicacao.
    O recurso e educacional e nao substitui decisao clinica.
  contact:
    name: Equipe SistemaAPI PIBIC
  license:
    name: Uso academico
externalDocs:
  description: Projeto FreeLLMAPI usado como gateway no piloto
  url: https://github.com/tashfeenahmed/freellmapi
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Autentica usuario e retorna token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token JWT gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /alunos:
    get:
      summary: Lista alunos
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Alunos encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaAluno"
    post:
      summary: Cadastra aluno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlunoRequest"
      responses:
        "201":
          description: Aluno criado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /usuarios:
    get:
      summary: Lista usuarios de acesso
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Usuarios encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaUsuario"
    post:
      summary: Cadastra usuario com senha BCrypt e role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRequest"
      responses:
        "201":
          description: Usuario criado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /usuarios/{id}:
    get:
      summary: Busca usuario por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Usuario encontrado
    put:
      summary: Atualiza usuario, senha e role
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRequest"
      responses:
        "200":
          description: Usuario atualizado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /usuarios/{id}/ativar:
    patch:
      summary: Ativa usuario
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Usuario ativado
  /usuarios/{id}/desativar:
    patch:
      summary: Desativa usuario
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Usuario desativado
  /alunos/{id}:
    get:
      summary: Busca aluno por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Aluno encontrado
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      summary: Atualiza aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Aluno atualizado
    delete:
      summary: Remove aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Aluno removido
  /alunos/{id}/casos-disponiveis:
    get:
      summary: Lista casos publicados disponiveis para o aluno
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Casos publicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCasoClinico"
  /alunos/{id}/casos/{casoId}/completo:
    get:
      summary: Abre o caso publicado e inicia ou retoma a tentativa do aluno
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/casoId"
      responses:
        "200":
          description: Caso completo publicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoAluno"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
  /alunos/{id}/casos/{casoId}/responder:
    post:
      summary: Registra respostas de um aluno para um caso publicado
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/casoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponderCasoRequest"
      responses:
        "201":
          description: Resultado calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoCaso"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /alunos/{id}/historico:
    get:
      summary: Busca historico de respostas do aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Historico do aluno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricoAluno"
  /alunos/{id}/desempenho:
    get:
      summary: Busca desempenho consolidado do aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Desempenho do aluno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesempenhoAluno"
  /professores:
    get:
      summary: Lista professores
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Professores encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaProfessor"
    post:
      summary: Cadastra professor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessorRequest"
      responses:
        "201":
          description: Professor criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessorResponse"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /professores/cadastro:
    post:
      summary: Cadastra professor e sua credencial de acesso
      description: Operacao restrita a administradores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessorCadastroRequest"
      responses:
        "201":
          description: Professor e credencial criados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessorResponse"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /professores/{id}:
    get:
      summary: Busca professor por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Professor encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessorResponse"
    put:
      summary: Atualiza professor
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessorRequest"
      responses:
        "200":
          description: Professor atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessorResponse"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
    delete:
      summary: Remove professor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Professor removido
  /professores/{id}/casos:
    get:
      summary: Lista casos de um professor
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Casos do professor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCasoClinico"
  /professores/{id}/relatorio-desempenho:
    get:
      summary: Gera relatorio de desempenho do professor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Relatorio gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatorioDesempenhoProfessor"
  /pacientes:
    get:
      summary: Lista pacientes acessiveis ao usuario autenticado
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Pagina de pacientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaPaciente"
        "403":
          $ref: "#/components/responses/AcessoNegado"
    post:
      summary: Cria paciente em um caso clinico em rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Paciente"
      responses:
        "201":
          description: Paciente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paciente"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /pacientes/{id}:
    get:
      summary: Busca paciente por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paciente"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      summary: Atualiza paciente de um caso clinico em rascunho
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Paciente"
      responses:
        "200":
          description: Paciente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paciente"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
    delete:
      summary: Remove paciente de um caso clinico em rascunho
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Paciente removido
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
  /conteudos:
    get:
      summary: Lista conteudos clinicos acessiveis ao usuario autenticado
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Pagina de conteudos clinicos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaConteudoClinico"
        "403":
          $ref: "#/components/responses/AcessoNegado"
    post:
      summary: Cria conteudo clinico em um caso em rascunho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConteudoClinico"
      responses:
        "201":
          description: Conteudo clinico criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConteudoClinico"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /conteudos/{id}:
    get:
      summary: Busca conteudo clinico por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Conteudo clinico encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConteudoClinico"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      summary: Atualiza conteudo clinico de um caso em rascunho
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConteudoClinico"
      responses:
        "200":
          description: Conteudo clinico atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConteudoClinico"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
    delete:
      summary: Remove conteudo clinico de um caso em rascunho
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Conteudo clinico removido
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
  /perguntas:
    get:
      summary: Lista perguntas acessiveis ao usuario autenticado
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Pagina de perguntas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaPergunta"
    post:
      summary: Cria pergunta no caso informado no corpo
      description: O campo idCaso e obrigatorio neste endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerguntaRequest"
      responses:
        "201":
          description: Pergunta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerguntaResponse"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /perguntas/{id}:
    get:
      summary: Busca pergunta por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Pergunta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerguntaResponse"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      summary: Atualiza pergunta de um caso em rascunho
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerguntaRequest"
      responses:
        "200":
          description: Pergunta atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerguntaResponse"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
    delete:
      summary: Remove pergunta de um caso em rascunho
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Pergunta removida
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
  /perguntas/caso/{casoId}:
    get:
      summary: Lista perguntas de um caso com paginacao
      parameters:
        - $ref: "#/components/parameters/casoId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Pagina de perguntas do caso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaPergunta"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      summary: Cria pergunta no caso indicado no caminho
      description: O caso do caminho e usado; idCaso no corpo e opcional.
      parameters:
        - $ref: "#/components/parameters/casoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerguntaRequest"
      responses:
        "201":
          description: Pergunta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerguntaResponse"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /casos:
    get:
      summary: Lista casos clinicos com paginacao e filtros
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RASCUNHO, PUBLICADO, ARQUIVADO]
        - name: idProfessor
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: termo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            example: dataCriacao,desc
      responses:
        "200":
          description: Casos encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCasoClinico"
    post:
      summary: Cria caso clinico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoRequest"
      responses:
        "201":
          description: Caso criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoResponse"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /casos/{id}:
    get:
      summary: Busca caso por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Caso encontrado
    put:
      summary: Atualiza caso
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoRequest"
      responses:
        "200":
          description: Caso atualizado
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
    delete:
      summary: Remove caso
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Caso removido
        "409":
          $ref: "#/components/responses/Conflito"
  /casos/{id}/completo:
    get:
      summary: Busca caso completo com pacientes, conteudos e perguntas
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Caso completo
  /casos/{id}/publicar:
    patch:
      summary: Publica caso clinico
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Caso publicado
        "409":
          $ref: "#/components/responses/Conflito"
  /casos/{id}/ia/gerar:
    post:
      summary: Gera conteudo clinico com apoio da IA
      description: |
        Completa os campos nao informados pelo professor e salva o conteudo
        gerado no caso clinico. Aceita somente dados sinteticos ou previamente
        desidentificados. A saida deve ser revisada por um professor.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoIARequest"
      responses:
        "200":
          description: Conteudo clinico gerado e salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoIAResponse"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "502":
          $ref: "#/components/responses/FalhaProvedorIa"
        "503":
          $ref: "#/components/responses/CapacidadeIaIndisponivel"
        "504":
          $ref: "#/components/responses/TempoEsgotadoIa"
  /casos/{id}/ia/ajustar:
    post:
      summary: Ajusta conteudo clinico existente com apoio da IA
      description: |
        Reescreve o conteudo clinico mais recente do caso conforme o tipo de
        ajuste solicitado. Aceita somente dados sinteticos ou previamente
        desidentificados. A saida deve ser revisada por um professor.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoIAAjusteRequest"
      responses:
        "200":
          description: Conteudo clinico ajustado e salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoIAResponse"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "502":
          $ref: "#/components/responses/FalhaProvedorIa"
        "503":
          $ref: "#/components/responses/CapacidadeIaIndisponivel"
        "504":
          $ref: "#/components/responses/TempoEsgotadoIa"
  /casos/{id}/ia/perguntas/gerar:
    post:
      summary: Gera perguntas para um caso clinico com apoio da IA
      description: |
        Gera e persiste perguntas para um caso com conteudo clinico criado
        manualmente ou por IA. Aceita somente dados sinteticos ou previamente
        desidentificados. Perguntas e gabaritos exigem revisao humana.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GerarPerguntasIaRequestDTO"
      responses:
        "201":
          description: Perguntas geradas e persistidas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerguntaResponse"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "502":
          $ref: "#/components/responses/FalhaProvedorIa"
        "503":
          $ref: "#/components/responses/CapacidadeIaIndisponivel"
        "504":
          $ref: "#/components/responses/TempoEsgotadoIa"
  /casos/{id}/ia/auditoria:
    get:
      summary: Lista a trilha de auditoria das geracoes por IA do caso
      description: |
        Retorna somente metadados, hashes e referencias de proveniencia; o
        conteudo clinico e a saida do modelo nao sao duplicados nesta trilha.
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Pagina de eventos de geracao por IA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaAuditoriaGeracaoIa"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /casos/{id}/respostas/pendentes-revisao:
    get:
      summary: Lista respostas discursivas ou de conduta pendentes de revisao
      description: Disponivel ao professor responsavel pelo caso e a administradores.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: sort
          in: query
          description: Ordenacao no formato campo,direcao.
          schema:
            type: string
            default: dataResposta,asc
      responses:
        "200":
          description: Pagina de respostas que aguardam revisao humana
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaRespostaAluno"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /casos/{id}/respostas/{idResposta}/revisao:
    patch:
      summary: Registra a revisao humana de uma resposta discursiva ou de conduta
      description: |
        A mesma decisao pode ser reenviada de forma idempotente. Uma decisao
        diferente para uma resposta ja revisada retorna conflito.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: idResposta
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisarRespostaRequestDTO"
      responses:
        "200":
          description: Resposta revisada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisaoResposta"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /casos/{id}/respostas/{idResposta}/revisoes:
    get:
      summary: Lista o historico imutavel de revisoes de uma resposta
      parameters:
        - $ref: "#/components/parameters/id"
        - name: idResposta
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Revisoes em ordem cronologica
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevisaoResposta"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          $ref: "#/components/responses/AcessoNegado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /casos/{casoId}/perguntas:
    get:
      summary: Lista perguntas de um caso
      parameters:
        - $ref: "#/components/parameters/casoId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        "200":
          description: Perguntas encontradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaPergunta"
    post:
      summary: Cria pergunta vinculada ao caso
      parameters:
        - $ref: "#/components/parameters/casoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerguntaRequest"
      responses:
        "201":
          description: Pergunta criada
        "409":
          $ref: "#/components/responses/Conflito"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    casoId:
      name: casoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    page:
      name: page
      in: query
      description: Indice da pagina, iniciando em zero.
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      description: Quantidade de elementos por pagina.
      schema:
        type: integer
        minimum: 1
        default: 20
    sort:
      name: sort
      in: query
      description: Ordenacao no formato campo,direcao.
      schema:
        type: string
        example: nome,asc
  responses:
    CorpoRequisicaoExcedido:
      description: O corpo da requisicao excede o limite configurado.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:sistema-api-pibic:problem:corpo-requisicao-excedido
            title: Corpo da requisicao excedido
            status: 413
            detail: O corpo da requisicao excede o limite permitido
            instance: /auth/login
            timestamp: "2026-08-22T20:00:00Z"
            correlationId: 7c973582-36bc-45a7-980f-285901008ad8
            erro: O corpo da requisicao excede o limite permitido
    LimiteAtingido:
      description: Limite de tentativas, cota de IA ou concorrencia atingido.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        Retry-After:
          description: Segundos que o cliente deve aguardar antes de tentar novamente.
          schema:
            type: integer
            format: int64
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:sistema-api-pibic:problem:limite-uso-ia
            title: Limite de uso da IA
            status: 429
            detail: O limite de geracoes de IA por minuto foi atingido
            instance: /casos/42/ia/gerar
            timestamp: "2026-08-22T20:00:00Z"
            correlationId: 7c973582-36bc-45a7-980f-285901008ad8
            erro: O limite de geracoes de IA por minuto foi atingido
    CapacidadeIaIndisponivel:
      description: |
        A integracao de IA nao foi configurada ou nenhum provedor possui
        capacidade disponivel no momento. Quando presente, Retry-After informa
        os segundos ate a proxima tentativa recomendada.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        Retry-After:
          description: Segundos que o cliente deve aguardar antes de tentar novamente.
          schema:
            type: integer
            format: int64
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            configuracaoAusente:
              value:
                type: urn:sistema-api-pibic:problem:servico-indisponivel
                title: Servico indisponivel
                status: 503
                detail: Configure a integracao de IA antes de usar este recurso
                instance: /casos/42/ia/gerar
                timestamp: "2026-08-22T20:00:00Z"
                correlationId: 7c973582-36bc-45a7-980f-285901008ad8
                erro: Configure a variavel IA_CHAVE_API antes de usar a IA
            capacidadeEsgotada:
              value:
                type: urn:sistema-api-pibic:problem:capacidade-ia-esgotada
                title: Capacidade de IA esgotada
                status: 503
                detail: A capacidade gratuita dos provedores de IA foi esgotada temporariamente
                instance: /casos/42/ia/gerar
                timestamp: "2026-08-22T20:00:00Z"
                correlationId: 7c973582-36bc-45a7-980f-285901008ad8
                erro: A capacidade gratuita dos provedores de IA foi esgotada temporariamente
    TempoEsgotadoIa:
      description: O provedor de IA excedeu o tempo limite configurado.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:sistema-api-pibic:problem:tempo-esgotado-ia
            title: Tempo esgotado no provedor de IA
            status: 504
            detail: O provedor de IA excedeu o tempo limite da requisicao
            instance: /casos/42/ia/gerar
            timestamp: "2026-08-22T20:00:00Z"
            correlationId: 7c973582-36bc-45a7-980f-285901008ad8
            erro: O provedor de IA excedeu o tempo limite da requisicao
    FalhaProvedorIa:
      description: O provedor de IA rejeitou a solicitacao ou devolveu uma resposta invalida.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DadosInvalidos:
      description: A requisicao possui campos, JSON, parametros ou tipos invalidos.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NaoAutenticado:
      description: Token ausente, invalido, expirado ou usuario desativado.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AcessoNegado:
      description: O usuario autenticado nao possui permissao para a operacao.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NaoEncontrado:
      description: O recurso solicitado nao foi encontrado.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflito:
      description: O estado atual ou a concorrencia dos dados impede a operacao.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  headers:
    CorrelationId:
      description: Identificador da requisicao para rastreamento ponta a ponta.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - timestamp
        - correlationId
        - erro
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
        erro:
          type: string
          deprecated: true
          description: Alias legado de detail; mantido temporariamente para compatibilidade.
        errors:
          type: object
          additionalProperties:
            type: string
          description: Erros por campo quando a validacao falha.
        campos:
          type: object
          deprecated: true
          additionalProperties:
            type: string
          description: Alias legado de errors; mantido temporariamente para compatibilidade.
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          maxLength: 72
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEm:
          type: string
          format: date-time
        idUsuario:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, PROFESSOR, ALUNO]
        idAluno:
          type: integer
          format: int64
          nullable: true
        idProfessor:
          type: integer
          format: int64
          nullable: true
    UsuarioRequest:
      type: object
      required:
        - username
        - senha
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        senha:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        role:
          type: string
          enum: [ADMIN, PROFESSOR, ALUNO]
        ativo:
          type: boolean
        idAluno:
          type: integer
          format: int64
          nullable: true
          description: Obrigatorio para usuarios com role ALUNO.
        idProfessor:
          type: integer
          format: int64
          nullable: true
          description: Obrigatorio para usuarios com role PROFESSOR.
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, PROFESSOR, ALUNO]
        ativo:
          type: boolean
        idAluno:
          type: integer
          format: int64
          nullable: true
        idProfessor:
          type: integer
          format: int64
          nullable: true
    AlunoRequest:
      type: object
      required:
        - nome
        - email
        - curso
        - periodo
      properties:
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        curso:
          type: string
          maxLength: 120
        periodo:
          type: string
          maxLength: 20
    AlunoResponse:
      type: object
      properties:
        idAluno:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        curso:
          type: string
        periodo:
          type: string
    ProfessorRequest:
      type: object
      required:
        - nome
        - email
        - materia
      properties:
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        materia:
          type: string
          maxLength: 120
    ProfessorCadastroRequest:
      allOf:
        - $ref: "#/components/schemas/ProfessorRequest"
        - type: object
          required:
            - username
            - senha
          properties:
            username:
              type: string
              minLength: 3
              maxLength: 100
            senha:
              type: string
              format: password
              minLength: 12
              maxLength: 72
    ProfessorResponse:
      allOf:
        - $ref: "#/components/schemas/ProfessorRequest"
        - type: object
          properties:
            id:
              type: integer
              format: int64
    Paciente:
      type: object
      required:
        - idCaso
        - nome
        - profissao
        - sexo
        - idade
        - estadoCivil
        - altura
        - peso
      properties:
        idPaciente:
          type: integer
          format: int64
          readOnly: true
        idCaso:
          type: integer
          format: int64
          minimum: 1
        nome:
          type: string
          maxLength: 150
        profissao:
          type: string
          maxLength: 120
        sexo:
          type: string
          enum: [MASCULINO, FEMININO, OUTRO, NAO_INFORMADO]
        idade:
          type: integer
          minimum: 0
          maximum: 130
        estadoCivil:
          type: string
          enum: [SOLTEIRO, CASADO, DIVORCIADO, VIUVO, SEPARADO, UNIAO_ESTAVEL, NAO_INFORMADO]
        altura:
          type: string
          maxLength: 20
        peso:
          type: string
          maxLength: 20
    ConteudoClinico:
      type: object
      required:
        - idCaso
        - sintomas
        - contexto
        - examClinico
        - antecClinico
        - diagEsperado
      properties:
        idConteudo:
          type: integer
          format: int64
          readOnly: true
        idCaso:
          type: integer
          format: int64
          minimum: 1
        sintomas:
          type: string
          maxLength: 10000
        contexto:
          type: string
          maxLength: 10000
        examClinico:
          type: string
          maxLength: 10000
        antecClinico:
          type: string
          maxLength: 10000
        diagEsperado:
          type: string
          maxLength: 10000
    CasoClinicoRequest:
      type: object
      required:
        - titulo
        - dificuldade
        - disciplina
        - areaSaude
        - estilo
        - especialidade
      properties:
        idProfessor:
          type: integer
          format: int64
          nullable: true
        titulo:
          type: string
          maxLength: 200
        dificuldade:
          type: string
          maxLength: 30
        disciplina:
          type: string
          maxLength: 120
        areaSaude:
          type: string
          maxLength: 120
        estilo:
          type: string
          maxLength: 60
        especialidade:
          type: string
          maxLength: 120
        objetivoAprendizagem:
          type: string
          maxLength: 10000
        nivelDificuldade:
          type: string
          enum: [BAIXA, MEDIA, ALTA]
        tempoLimiteMinutos:
          type: integer
          minimum: 15
          maximum: 480
          default: 60
          description: Tempo total para responder o caso completo.
    CasoClinicoResponse:
      allOf:
        - $ref: "#/components/schemas/CasoClinicoRequest"
        - type: object
          properties:
            idCaso:
              type: integer
              format: int64
            status:
              type: string
              enum: [RASCUNHO, PUBLICADO, ARQUIVADO]
            dataCriacao:
              type: string
              format: date-time
            dataAtualizacao:
              type: string
              format: date-time
    CasoClinicoIARequest:
      type: object
      description: Campos preenchidos parcialmente pelo professor; os campos ausentes serao completados pela IA.
      required:
        - dadosSinteticosOuDesidentificados
      properties:
        sintomas:
          type: string
          maxLength: 10000
        contexto:
          type: string
          maxLength: 10000
        examClinico:
          type: string
          maxLength: 10000
        antecClinico:
          type: string
          maxLength: 10000
        diagEsperado:
          type: string
          maxLength: 10000
        permitirComplementoIa:
          type: boolean
          description: Permite que a IA complemente dados ausentes do paciente.
        incluirResultadosExamesClinicos:
          type: boolean
          description: Permite incluir resultados de exames laboratoriais, imagem ou complementares.
        informacoesAdicionaisPaciente:
          type: string
          maxLength: 10000
        dadosSinteticosOuDesidentificados:
          type: boolean
          enum: [true]
          description: Confirmacao obrigatoria de que nenhum dado pessoal identificavel sera enviado ao provedor.
    CasoClinicoIAAjusteRequest:
      type: object
      required:
        - tipoAjuste
        - dadosSinteticosOuDesidentificados
      properties:
        tipoAjuste:
          type: string
          enum: [REGERAR, SIMPLIFICAR, COMPLEXIFICAR, PERSONALIZADO]
        instrucao:
          type: string
          maxLength: 2000
        dadosSinteticosOuDesidentificados:
          type: boolean
          enum: [true]
          description: Confirmacao obrigatoria de que o contexto enviado esta sintetico ou desidentificado.
    CasoClinicoIAResponse:
      type: object
      properties:
        idConteudo:
          type: integer
          format: int64
        idCaso:
          type: integer
          format: int64
        sintomas:
          type: string
          maxLength: 10000
        contexto:
          type: string
          maxLength: 10000
        examClinico:
          type: string
          maxLength: 10000
        antecClinico:
          type: string
          maxLength: 10000
        diagEsperado:
          type: string
          maxLength: 10000
    AuditoriaGeracaoIa:
      type: object
      required:
        - id
        - idCaso
        - idUsuario
        - operacao
        - provedor
        - modelo
        - versaoPrompt
        - hashContexto
        - hashSaida
        - referenciaResultado
        - quantidadeItens
        - dadosDesidentificadosConfirmados
        - dataGeracao
      properties:
        id:
          type: integer
          format: int64
        idCaso:
          type: integer
          format: int64
        idUsuario:
          type: integer
          format: int64
        operacao:
          type: string
          enum: [GERAR_CASO, AJUSTAR_CASO, GERAR_PERGUNTAS]
        provedor:
          type: string
        modelo:
          type: string
        versaoPrompt:
          type: string
        hashContexto:
          type: string
          description: Hash SHA-256 do contexto desidentificado enviado.
        hashSaida:
          type: string
          description: Hash SHA-256 da saida recebida, sem duplicar seu conteudo.
        referenciaResultado:
          type: string
        quantidadeItens:
          type: integer
          format: int32
          minimum: 1
        dadosDesidentificadosConfirmados:
          type: boolean
        dataGeracao:
          type: string
          format: date-time
    GerarPerguntasIaRequestDTO:
      type: object
      description: Configuracao da geracao de perguntas; a confirmacao de desidentificacao e obrigatoria.
      required:
        - dadosSinteticosOuDesidentificados
      properties:
        quantidade:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          example: 5
        tipo:
          type: string
          enum: [MULTIPLA_ESCOLHA, DISCURSIVA, VERDADEIRO_FALSO, DIAGNOSTICO, CONDUTA_CLINICA]
          default: MULTIPLA_ESCOLHA
          example: MULTIPLA_ESCOLHA
        quantidadeAlternativas:
          type: integer
          minimum: 2
          maximum: 5
          default: 4
          example: 4
        instrucoesAdicionais:
          type: string
          maxLength: 2000
          example: Priorize raciocinio diagnostico e conduta inicial.
        dadosSinteticosOuDesidentificados:
          type: boolean
          enum: [true]
          description: Confirmacao obrigatoria de que o contexto enviado esta sintetico ou desidentificado.
