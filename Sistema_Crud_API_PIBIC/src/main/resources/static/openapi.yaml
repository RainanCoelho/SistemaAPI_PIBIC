openapi: 3.0.3
info:
  title: SistemaAPI PIBIC
  version: 1.0.0
  description: |
    API REST para gerenciamento e resolucao de casos clinicos academicos.
    As operacoes de IA aceitam somente dados sinteticos ou previamente
    desidentificados e toda saida exige revisao humana antes da publicacao.
    O recurso e educacional e nao substitui decisao clinica.
  contact:
    name: Equipe SistemaAPI PIBIC
  license:
    name: Uso academico
externalDocs:
  description: Projeto FreeLLMAPI usado como gateway no piloto
  url: https://github.com/tashfeenahmed/freellmapi
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Autentica usuario e retorna token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token JWT gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciais invalidas
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /alunos:
    get:
      summary: Lista alunos
      responses:
        "200":
          description: Alunos encontrados
    post:
      summary: Cadastra aluno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlunoRequest"
      responses:
        "201":
          description: Aluno criado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /usuarios:
    get:
      summary: Lista usuarios de acesso
      responses:
        "200":
          description: Usuarios encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioResponse"
    post:
      summary: Cadastra usuario com senha BCrypt e role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRequest"
      responses:
        "201":
          description: Usuario criado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /usuarios/{id}:
    get:
      summary: Busca usuario por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Usuario encontrado
    put:
      summary: Atualiza usuario, senha e role
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRequest"
      responses:
        "200":
          description: Usuario atualizado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /usuarios/{id}/ativar:
    patch:
      summary: Ativa usuario
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Usuario ativado
  /usuarios/{id}/desativar:
    patch:
      summary: Desativa usuario
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Usuario desativado
  /alunos/{id}:
    get:
      summary: Busca aluno por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Aluno encontrado
        "404":
          description: Aluno nao encontrado
    put:
      summary: Atualiza aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Aluno atualizado
    delete:
      summary: Remove aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Aluno removido
  /alunos/{id}/casos-disponiveis:
    get:
      summary: Lista casos publicados disponiveis para o aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Casos publicados
  /alunos/{id}/casos/{casoId}/completo:
    get:
      summary: Abre o caso publicado e inicia ou retoma a tentativa do aluno
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/casoId"
      responses:
        "200":
          description: Caso completo publicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoAluno"
        "400":
          description: Caso ainda nao publicado
  /alunos/{id}/casos/{casoId}/responder:
    post:
      summary: Registra respostas de um aluno para um caso publicado
      parameters:
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/casoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponderCasoRequest"
      responses:
        "201":
          description: Resultado calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoCaso"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /alunos/{id}/historico:
    get:
      summary: Busca historico de respostas do aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Historico do aluno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricoAluno"
  /alunos/{id}/desempenho:
    get:
      summary: Busca desempenho consolidado do aluno
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Desempenho do aluno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesempenhoAluno"
  /professores:
    get:
      summary: Lista professores
      responses:
        "200":
          description: Professores encontrados
    post:
      summary: Cadastra professor
      responses:
        "201":
          description: Professor criado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /professores/{id}:
    get:
      summary: Busca professor por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Professor encontrado
    put:
      summary: Atualiza professor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Professor atualizado
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
    delete:
      summary: Remove professor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Professor removido
  /professores/{id}/casos:
    get:
      summary: Lista casos de um professor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Casos do professor
  /professores/{id}/relatorio-desempenho:
    get:
      summary: Gera relatorio de desempenho do professor
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Relatorio gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatorioDesempenhoProfessor"
  /casos:
    get:
      summary: Lista casos clinicos com paginacao e filtros
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RASCUNHO, PUBLICADO, ARQUIVADO]
        - name: idProfessor
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: termo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            example: dataCriacao,desc
      responses:
        "200":
          description: Casos encontrados
    post:
      summary: Cria caso clinico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoRequest"
      responses:
        "201":
          description: Caso criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoResponse"
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /casos/{id}:
    get:
      summary: Busca caso por ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Caso encontrado
    put:
      summary: Atualiza caso
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoRequest"
      responses:
        "200":
          description: Caso atualizado
        "409":
          description: O caso clinico so pode ser atualizado enquanto estiver em RASCUNHO
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
    delete:
      summary: Remove caso
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Caso removido
        "409":
          description: O caso clinico so pode ser removido enquanto estiver em RASCUNHO
  /casos/{id}/completo:
    get:
      summary: Busca caso completo com pacientes, conteudos e perguntas
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Caso completo
  /casos/{id}/publicar:
    patch:
      summary: Publica caso clinico
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Caso publicado
        "409":
          description: O caso clinico ja saiu do estado RASCUNHO
  /casos/{id}/ia/gerar:
    post:
      summary: Gera conteudo clinico com apoio da IA
      description: |
        Completa os campos nao informados pelo professor e salva o conteudo
        gerado no caso clinico. Aceita somente dados sinteticos ou previamente
        desidentificados. A saida deve ser revisada por um professor.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoIARequest"
      responses:
        "200":
          description: Conteudo clinico gerado e salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoIAResponse"
        "400":
          description: Dados invalidos
        "403":
          description: Usuario sem acesso ao caso clinico
        "409":
          description: O caso saiu do estado RASCUNHO ou mudou durante a geracao
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "502":
          description: Falha no provedor de IA
        "503":
          $ref: "#/components/responses/CapacidadeIaIndisponivel"
        "504":
          $ref: "#/components/responses/TempoEsgotadoIa"
  /casos/{id}/ia/ajustar:
    post:
      summary: Ajusta conteudo clinico existente com apoio da IA
      description: |
        Reescreve o conteudo clinico mais recente do caso conforme o tipo de
        ajuste solicitado. Aceita somente dados sinteticos ou previamente
        desidentificados. A saida deve ser revisada por um professor.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasoClinicoIAAjusteRequest"
      responses:
        "200":
          description: Conteudo clinico ajustado e salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasoClinicoIAResponse"
        "400":
          description: Dados invalidos
        "403":
          description: Usuario sem acesso ao caso clinico
        "409":
          description: O caso ou seu conteudo mudou durante o ajuste
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "502":
          description: Falha no provedor de IA
        "503":
          $ref: "#/components/responses/CapacidadeIaIndisponivel"
        "504":
          $ref: "#/components/responses/TempoEsgotadoIa"
  /casos/{id}/ia/perguntas/gerar:
    post:
      summary: Gera perguntas para um caso clinico com apoio da IA
      description: |
        Gera e persiste perguntas para um caso com conteudo clinico criado
        manualmente ou por IA. Aceita somente dados sinteticos ou previamente
        desidentificados. Perguntas e gabaritos exigem revisao humana.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GerarPerguntasIaRequestDTO"
      responses:
        "201":
          description: Perguntas geradas e persistidas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerguntaResponse"
        "400":
          description: Parametros de geracao invalidos
        "403":
          description: Usuario sem acesso ao caso clinico
        "404":
          description: Caso clinico nao encontrado
        "409":
          description: O caso saiu do estado RASCUNHO ou seu contexto/perguntas mudou durante a geracao
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
        "429":
          $ref: "#/components/responses/LimiteAtingido"
        "502":
          description: Falha no provedor de IA ao gerar as perguntas
        "503":
          $ref: "#/components/responses/CapacidadeIaIndisponivel"
        "504":
          $ref: "#/components/responses/TempoEsgotadoIa"
  /casos/{id}/respostas/pendentes-revisao:
    get:
      summary: Lista respostas discursivas ou de conduta pendentes de revisao
      description: Disponivel ao professor responsavel pelo caso e a administradores.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: sort
          in: query
          description: Ordenacao no formato campo,direcao.
          schema:
            type: string
            default: dataResposta,asc
      responses:
        "200":
          description: Pagina de respostas que aguardam revisao humana
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaRespostaAluno"
        "403":
          description: Usuario sem acesso ao caso clinico
        "404":
          description: Caso clinico nao encontrado
  /casos/{id}/respostas/{idResposta}/revisao:
    patch:
      summary: Registra a revisao humana de uma resposta discursiva ou de conduta
      description: |
        A mesma decisao pode ser reenviada de forma idempotente. Uma decisao
        diferente para uma resposta ja revisada retorna conflito.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: idResposta
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisarRespostaRequestDTO"
      responses:
        "200":
          description: Resposta revisada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespostaAluno"
        "400":
          description: Dados invalidos, resposta de outro caso ou tipo sem revisao humana
        "403":
          description: Usuario sem acesso ao caso clinico
        "404":
          description: Caso clinico ou resposta nao encontrada
        "409":
          description: A resposta ja foi revisada com um resultado diferente
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
  /casos/{casoId}/perguntas:
    get:
      summary: Lista perguntas de um caso
      parameters:
        - $ref: "#/components/parameters/casoId"
      responses:
        "200":
          description: Perguntas encontradas
    post:
      summary: Cria pergunta vinculada ao caso
      parameters:
        - $ref: "#/components/parameters/casoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerguntaRequest"
      responses:
        "201":
          description: Pergunta criada
        "409":
          description: O caso clinico so pode receber perguntas enquanto estiver em RASCUNHO
        "413":
          $ref: "#/components/responses/CorpoRequisicaoExcedido"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    casoId:
      name: casoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    CorpoRequisicaoExcedido:
      description: O corpo da requisicao excede o limite configurado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroResponse"
          example:
            erro: O corpo da requisicao excede o limite permitido
    LimiteAtingido:
      description: Limite de tentativas, cota de IA ou concorrencia atingido.
      headers:
        Retry-After:
          description: Segundos que o cliente deve aguardar antes de tentar novamente.
          schema:
            type: integer
            format: int64
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroResponse"
          example:
            erro: O limite de geracoes de IA por minuto foi atingido
    CapacidadeIaIndisponivel:
      description: |
        A integracao de IA nao foi configurada ou nenhum provedor possui
        capacidade disponivel no momento. Quando presente, Retry-After informa
        os segundos ate a proxima tentativa recomendada.
      headers:
        Retry-After:
          description: Segundos que o cliente deve aguardar antes de tentar novamente.
          schema:
            type: integer
            format: int64
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroResponse"
          examples:
            configuracaoAusente:
              value:
                erro: Configure a variavel IA_CHAVE_API antes de usar a IA
            capacidadeEsgotada:
              value:
                erro: A capacidade gratuita dos provedores de IA foi esgotada temporariamente
    TempoEsgotadoIa:
      description: O provedor de IA excedeu o tempo limite configurado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErroResponse"
          example:
            erro: O provedor de IA excedeu o tempo limite da requisicao
  schemas:
    ErroResponse:
      type: object
      required:
        - erro
      properties:
        erro:
          type: string
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          maxLength: 72
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEm:
          type: string
          format: date-time
        idUsuario:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, PROFESSOR, ALUNO]
        idAluno:
          type: integer
          format: int64
          nullable: true
        idProfessor:
          type: integer
          format: int64
          nullable: true
    UsuarioRequest:
      type: object
      required:
        - username
        - senha
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        senha:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        role:
          type: string
          enum: [ADMIN, PROFESSOR, ALUNO]
        ativo:
          type: boolean
        idAluno:
          type: integer
          format: int64
          nullable: true
          description: Obrigatorio para usuarios com role ALUNO.
        idProfessor:
          type: integer
          format: int64
          nullable: true
          description: Obrigatorio para usuarios com role PROFESSOR.
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, PROFESSOR, ALUNO]
        ativo:
          type: boolean
        idAluno:
          type: integer
          format: int64
          nullable: true
        idProfessor:
          type: integer
          format: int64
          nullable: true
    AlunoRequest:
      type: object
      required:
        - nome
        - email
        - curso
        - periodo
      properties:
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        curso:
          type: string
          maxLength: 120
        periodo:
          type: string
          maxLength: 20
    AlunoResponse:
      type: object
      properties:
        idAluno:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
        curso:
          type: string
        periodo:
          type: string
    CasoClinicoRequest:
      type: object
      required:
        - titulo
        - dificuldade
        - disciplina
        - areaSaude
        - estilo
        - especialidade
      properties:
        idProfessor:
          type: integer
          format: int64
          nullable: true
        titulo:
          type: string
          maxLength: 200
        dificuldade:
          type: string
          maxLength: 30
        disciplina:
          type: string
          maxLength: 120
        areaSaude:
          type: string
          maxLength: 120
        estilo:
          type: string
          maxLength: 60
        especialidade:
          type: string
          maxLength: 120
        objetivoAprendizagem:
          type: string
          maxLength: 10000
        nivelDificuldade:
          type: string
          enum: [BAIXA, MEDIA, ALTA]
        tempoLimiteMinutos:
          type: integer
          minimum: 15
          maximum: 480
          default: 60
          description: Tempo total para responder o caso completo.
    CasoClinicoResponse:
      allOf:
        - $ref: "#/components/schemas/CasoClinicoRequest"
        - type: object
          properties:
            idCaso:
              type: integer
              format: int64
            status:
              type: string
              enum: [RASCUNHO, PUBLICADO, ARQUIVADO]
            dataCriacao:
              type: string
              format: date-time
            dataAtualizacao:
              type: string
              format: date-time
    CasoClinicoIARequest:
      type: object
      description: Campos preenchidos parcialmente pelo professor; os campos ausentes serao completados pela IA.
      properties:
        sintomas:
          type: string
          maxLength: 10000
        contexto:
          type: string
          maxLength: 10000
        examClinico:
          type: string
          maxLength: 10000
        antecClinico:
          type: string
          maxLength: 10000
        diagEsperado:
          type: string
          maxLength: 10000
        permitirComplementoIa:
          type: boolean
          description: Permite que a IA complemente dados ausentes do paciente.
        incluirResultadosExamesClinicos:
          type: boolean
          description: Permite incluir resultados de exames laboratoriais, imagem ou complementares.
        informacoesAdicionaisPaciente:
          type: string
          maxLength: 10000
    CasoClinicoIAAjusteRequest:
